<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>DUKOPS BABINSA LILIGUNDI - Koramil 1609-01/Buleleng</title>
    <meta name="theme-color" content="#1e3b2c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Aplikasi DUKOPS Babinsa Liligundi - Koramil 1609-01/Buleleng">
    
    <!-- Icon untuk berbagai platform -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a1814 0%, #11221c 100%);
            color: #eef4ea;
            padding: 16px 12px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(26, 44, 37, 0.95);
            border-radius: 28px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1a3a2c, #0f2a20);
            padding: 16px 20px 12px;
            text-align: center;
            border-bottom: 1px solid #3a6b55;
        }
        
        .header-row1 {
            margin-bottom: 4px;
        }
        .header-title h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #e2ffe6, #b0e0b0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin: 0;
            letter-spacing: 1.5px;
        }
        
        .header-row2 {
            text-align: center;
            margin-bottom: 14px;
        }
        .sub {
            font-size: 0.9rem;
            opacity: 0.9;
            color: #c7e9cf;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        .header-row3 {
            text-align: center;
            margin-bottom: 10px;
        }
        .header-icon-right {
            width: 65px;
            height: 65px;
            object-fit: contain;
            border-radius: 16px;
            background: #1a3a2c;
            padding: 5px;
        }
        
        .header-row4 {
            text-align: center;
        }
        .badge-area {
            display: inline-flex;
            background: #2a5541;
            padding: 5px 18px;
            border-radius: 40px;
            font-size: 0.8rem;
            gap: 8px;
            font-weight: 500;
        }
        
        .content { padding: 20px 22px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; font-size: 0.85rem; color: #cbefd4; margin-bottom: 6px; }
        label i { margin-right: 6px; }
        
        input, textarea {
            width: 100%;
            padding: 10px 14px;
            background: #1e352b;
            border: 1px solid #3b6b55;
            border-radius: 18px;
            font-size: 0.9rem;
            color: #f0faf3;
            transition: all 0.2s;
            font-family: Arial, sans-serif;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #7bcb9e;
            background: #254f3f;
            box-shadow: 0 0 0 2px rgba(92, 186, 125, 0.2);
        }
        textarea { resize: vertical; min-height: 85px; line-height: 1.4; }
        
        /* Input file styling */
        .file-input-wrapper {
            position: relative;
            width: 100%;
        }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            top: 0;
            left: 0;
        }
        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 10px 14px;
            background: #1e352b;
            border: 1px solid #3b6b55;
            border-radius: 18px;
            font-size: 0.9rem;
            color: #f0faf3;
            cursor: pointer;
            transition: all 0.2s;
        }
        .file-input-label:hover {
            background: #254f3f;
            border-color: #7bcb9e;
        }
        .file-input-label span:first-child {
            color: #bde5ca;
        }
        .file-input-label span:last-child {
            color: #8abf9a;
            font-size: 0.8rem;
        }
        
        /* Koordinat inline */
        .coord-wrapper {
            display: flex;
            align-items: center;
            background: #1e352b;
            border: 1px solid #3b6b55;
            border-radius: 18px;
            padding: 10px 14px;
            min-height: 44px;
        }
        .coord-label {
            color: #bde5ca;
            margin-right: 8px;
            font-weight: 500;
            white-space: nowrap;
        }
        .coord-value {
            color: #f0faf3;
            word-break: break-all;
            flex: 1;
        }
        .coord-refresh {
            background: none;
            border: none;
            color: #63b581;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0 5px;
            margin-left: 5px;
        }
        .coord-refresh:hover {
            color: #7bcb9e;
        }
        
        .canvas-wrapper {
            background: #0e221c;
            border-radius: 22px;
            padding: 8px;
            margin: 16px 0 8px;
            border: 1px solid #3c6b54;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            border-radius: 16px;
            background: #1b3028;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
            height: auto;
        }
        .btn-primary {
            background: linear-gradient(95deg, #317456, #1f543f);
            border: none;
            padding: 12px 18px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 50px;
            width: 100%;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 12px;
        }
        .btn-primary:hover:not(:disabled) { background: linear-gradient(95deg, #409b72, #2b7054); transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #3a5548; border: none; padding: 10px; font-weight: 600; border-radius: 50px; width: 100%; color: #f0fff0; cursor: pointer; margin-top: 10px; }
        .btn-secondary:hover { background: #577b66; }
        .loader-overlay { display: flex; justify-content: center; margin: 6px 0; }
        .loader { width: 30px; height: 30px; border: 3px solid #3c775b; border-top: 3px solid #c5f5d3; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hint { font-size: 0.65rem; color: #9bc2aa; margin-top: 4px; margin-left: 10px; }
        hr { border: none; border-top: 1px solid #3e6857; margin: 16px 0 10px; }
        
        /* LOG SECTION */
        .log-section {
            margin-top: 18px;
            background: #12261f;
            border-radius: 20px;
            padding: 12px;
            border: 1px solid #3a6b55;
        }
        .log-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #bde0ca;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding-bottom: 8px;
            border-bottom: 1px solid #3a6b55;
        }
        .log-title span:first-child i {
            margin-right: 6px;
        }
        .log-count {
            background: #2a5541;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .log-list {
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.7rem;
        }
        .log-item {
            background: #1a352b;
            padding: 6px 10px;
            margin-bottom: 5px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #63b581;
        }
        .log-filename {
            font-weight: 600;
            color: #bde5ca;
            word-break: break-all;
            flex: 1;
            font-size: 0.7rem;
        }
        .log-time {
            color: #8abf9a;
            font-size: 0.65rem;
            margin-left: 8px;
        }
        .empty-log {
            text-align: center;
            color: #8abf9a;
            padding: 12px;
            font-style: italic;
            font-size: 0.7rem;
        }
        
        #installContainer {
            position: fixed; bottom: 20px; left: 20px; right: 20px; background: #1e3a2f; padding: 12px; border-radius: 24px;
            z-index: 1000; display: none; text-align: center; border: 1px solid #5b9b7a;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .install-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }
        .install-buttons button { padding: 8px 20px; margin: 0; width: auto; font-size: 0.8rem; }
        
        @media (max-width: 550px) {
            body { padding: 12px 8px; }
            .content { padding: 16px 18px; }
            .header-icon-right { width: 55px; height: 55px; }
            .header-title h1 { font-size: 1.5rem; }
            .sub { font-size: 0.75rem; }
            .badge-area { font-size: 0.7rem; padding: 4px 14px; }
            .coord-label { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-row1">
            <div class="header-title">
                <h1>DUKOPS BABINSA</h1>
            </div>
        </div>
        <div class="header-row2">
            <div class="sub">Koramil 1609-01 / Buleleng</div>
        </div>
        <div class="header-row3">
            <img class="header-icon-right" src="https://raw.githubusercontent.com/Babinsa05/LILIGUNDI/main/profile%20liligundi.png" alt="Logo" onerror="this.style.display='none'">
        </div>
        <div class="header-row4">
            <div class="badge-area">
                <span>📍 Kelurahan Liligundi</span>
            </div>
        </div>
    </div>
    <div class="content">
        <!-- Judul Kegiatan -->
        <div class="form-group">
            <label><i class="fas fa-tag"></i> Judul Kegiatan</label>
            <input type="text" id="judulKegiatanInput" placeholder="Judul Kegiatan" value="Kelurahan Liligundi">
        </div>

        <!-- Koordinat (inline dengan label) -->
        <div class="form-group">
            <label><i class="fas fa-map-marker-alt"></i> Koordinat</label>
            <div class="coord-wrapper">
                <span class="coord-label">📍</span>
                <span class="coord-value" id="coordValue">Pilih foto untuk mendapatkan koordinat</span>
                <button class="coord-refresh" id="refreshCoordBtn" title="Acak koordinat"><i class="fas fa-sync-alt"></i></button>
            </div>
        </div>

        <!-- Foto Kegiatan -->
        <div class="form-group">
            <label><i class="fas fa-camera"></i> Foto Kegiatan</label>
            <div class="file-input-wrapper" id="fileInputWrapper">
                <div class="file-input-label" id="fileInputLabel">
                    <span><i class="fas fa-upload"></i> Pilih file</span>
                    <span id="fileNameDisplay">Belum ada file</span>
                </div>
                <input type="file" id="gambar" accept="image/*">
            </div>
        </div>

        <!-- Tanggal & Waktu -->
        <div class="form-group">
            <label><i class="fas fa-calendar-alt"></i> Tanggal & Waktu</label>
            <input type="datetime-local" id="tanggalWaktu">
        </div>

        <!-- Narasi Kegiatan -->
        <div class="form-group">
            <label><i class="fas fa-file-alt"></i> Narasi Kegiatan</label>
            <textarea id="narasi" rows="4" placeholder="Tulis detail kegiatan DUKOPS..."></textarea>
        </div>

        <!-- Canvas Preview -->
        <div class="canvas-wrapper">
            <canvas id="canvas" width="759" height="300"></canvas>
        </div>
        <div class="loader-overlay"><div class="loader" id="loadingIndicator"></div></div>

        <!-- Tombol -->
        <button id="downloadBtn" class="btn-primary" disabled><i class="fas fa-download"></i> SIMPAN LAPORAN (ZIP)</button>
        <button id="resetBtn" class="btn-secondary"><i class="fas fa-trash-alt"></i> Reset semua data</button>
        
        <!-- LOG FILE TERKIRIM -->
        <div class="log-section">
            <div class="log-title">
                <span><i class="fas fa-history"></i> Riwayat Laporan Tersimpan</span>
                <span class="log-count" id="logCountBadge">0</span>
            </div>
            <div id="logList" class="log-list">
                <div class="empty-log">Belum ada laporan tersimpan</div>
            </div>
        </div>
        <hr>
    </div>
</div>
<div id="installContainer">
    <p><i class="fas fa-mobile-alt"></i> Pasang Aplikasi DUKOPS di HP</p>
    <div class="install-buttons">
        <button id="installButton" style="background:#317456;"><i class="fas fa-download"></i> Pasang</button>
        <button id="closeInstall" style="background:#5a3a3a;"><i class="fas fa-times"></i> Tutup</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
    // ======================== KONFIGURASI ========================
    const GITHUB_JSON_URL = 'https://raw.githubusercontent.com/Babinsa05/LILIGUNDI/refs/heads/main/koordinat.json';
    
    let KOORDINAT_LIST = [];
    let koordinatLoaded = false;
    const STORAGE_KEY_COUNTER = "dukops_counter";
    const STORAGE_KEY_LOGS = "dukops_logs";
    const STORAGE_KEY_SUBMITTED_FULLDATES = "dukops_submitted_fulldates"; // Menyimpan TANGGAL LENGKAP (YYYY-MM-DD) yang sudah pernah dibuat laporan
    
    // DOM Elements
    const judulInput = document.getElementById('judulKegiatanInput');
    const coordValueSpan = document.getElementById('coordValue');
    const refreshCoordBtn = document.getElementById('refreshCoordBtn');
    const gambarInput = document.getElementById('gambar');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const fileInputLabel = document.getElementById('fileInputLabel');
    const tanggalInput = document.getElementById('tanggalWaktu');
    const narasiText = document.getElementById('narasi');
    const canvas = document.getElementById('canvas');
    const downloadBtn = document.getElementById('downloadBtn');
    const loader = document.getElementById('loadingIndicator');
    const resetBtn = document.getElementById('resetBtn');
    const logListDiv = document.getElementById('logList');
    const logCountBadge = document.getElementById('logCountBadge');
    
    let currentImage = new Image();
    let currentKoordinat = "";
    let currentJudul = "Kelurahan Liligundi";
    let currentTimestamp = "";
    let submissionCount = 0;
    let sequenceNumber = 0;
    
    // ======================== ANTI GANDA - CEK TANGGAL LENGKAP YANG SAMA ========================
    // Mendapatkan kunci tanggal lengkap (format: YYYY-MM-DD, contoh: 2026-04-02)
    function getFullDateKey(dateString) {
        if (!dateString) return null;
        let date = new Date(dateString);
        if (isNaN(date.getTime())) return null;
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }
    
    // Cek apakah tanggal (YYYY-MM-DD) yang dipilih sudah pernah dibuat laporan
    function isFullDateAlreadySubmitted(dateString) {
        const submittedDates = JSON.parse(localStorage.getItem(STORAGE_KEY_SUBMITTED_FULLDATES) || '[]');
        const dateKey = getFullDateKey(dateString);
        return submittedDates.includes(dateKey);
    }
    
    // Simpan tanggal lengkap (YYYY-MM-DD) yang sudah dibuat laporan
    function saveSubmittedFullDate(dateString) {
        const dateKey = getFullDateKey(dateString);
        if (!dateKey) return;
        let submittedDates = JSON.parse(localStorage.getItem(STORAGE_KEY_SUBMITTED_FULLDATES) || '[]');
        if (!submittedDates.includes(dateKey)) {
            submittedDates.push(dateKey);
            localStorage.setItem(STORAGE_KEY_SUBMITTED_FULLDATES, JSON.stringify(submittedDates));
        }
    }
    
    // Hapus semua data tanggal yang tersimpan (saat reset)
    function clearSubmittedFullDates() {
        localStorage.removeItem(STORAGE_KEY_SUBMITTED_FULLDATES);
    }
    
    // ======================== LOG SYSTEM ========================
    function updateLogBadge() {
        const savedLogs = localStorage.getItem(STORAGE_KEY_LOGS);
        if (savedLogs) {
            try {
                const logs = JSON.parse(savedLogs);
                if (logCountBadge) logCountBadge.textContent = logs.length;
            } catch(e) { if (logCountBadge) logCountBadge.textContent = "0"; }
        } else {
            if (logCountBadge) logCountBadge.textContent = "0";
        }
    }
    
    function loadLogs() {
        const savedLogs = localStorage.getItem(STORAGE_KEY_LOGS);
        if (savedLogs) {
            try {
                const logs = JSON.parse(savedLogs);
                displayLogs(logs);
                if (logCountBadge) logCountBadge.textContent = logs.length;
            } catch(e) { console.error(e); }
        } else {
            if (logCountBadge) logCountBadge.textContent = "0";
        }
    }
    
    function displayLogs(logs) {
        if (!logListDiv) return;
        if (!logs || logs.length === 0) {
            logListDiv.innerHTML = '<div class="empty-log">Belum ada laporan tersimpan</div>';
            return;
        }
        logListDiv.innerHTML = '';
        logs.forEach(log => {
            const logItem = document.createElement('div');
            logItem.className = 'log-item';
            logItem.innerHTML = `
                <span class="log-filename"><i class="fas fa-file-archive"></i> ${log.filename}</span>
                <span class="log-time"><i class="far fa-clock"></i> ${log.time || '-'}</span>
            `;
            logListDiv.appendChild(logItem);
        });
    }
    
    function saveLog(filename, timeStr) {
        let logs = [];
        const savedLogs = localStorage.getItem(STORAGE_KEY_LOGS);
        if (savedLogs) {
            try {
                logs = JSON.parse(savedLogs);
            } catch(e) { logs = []; }
        }
        logs.unshift({ filename, time: timeStr, date: new Date().toISOString() });
        if (logs.length > 50) logs = logs.slice(0, 50);
        localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(logs));
        displayLogs(logs);
        if (logCountBadge) logCountBadge.textContent = logs.length;
    }
    
    function addLog(filename) {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        saveLog(filename, timeStr);
    }
    
    function resetAllData() {
        if (confirm("RESET SEMUA DATA? Menghapus semua laporan tersimpan, data tanggal terkirim, dan mengatur ulang penghitung. Data tidak dapat dikembalikan.")) {
            localStorage.removeItem(STORAGE_KEY_COUNTER);
            localStorage.removeItem(STORAGE_KEY_LOGS);
            localStorage.removeItem(STORAGE_KEY_SUBMITTED_FULLDATES);
            submissionCount = 0;
            sequenceNumber = 0;
            displayLogs([]);
            if (logCountBadge) logCountBadge.textContent = "0";
            alert("✅ Semua data laporan, riwayat tanggal, dan penghitung telah direset.");
        }
    }
    
    // ======================== FUNGSI UNTUK ACAK DETIK ========================
    function acakDetik(pilihWaktu) {
        if (!pilihWaktu) return null;
        let dateObj = new Date(pilihWaktu);
        if (isNaN(dateObj.getTime())) return null;
        const detikAcak = Math.floor(Math.random() * 60);
        dateObj.setSeconds(detikAcak);
        currentTimestamp = dateObj.toISOString();
        return dateObj;
    }
    
    // ======================== LOAD KOORDINAT DARI GITHUB ========================
    async function loadKoordinat() {
        try {
            const response = await fetch(GITHUB_JSON_URL);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            if (!data.koordinat || data.koordinat.length === 0) {
                throw new Error('File koordinat kosong');
            }
            KOORDINAT_LIST = data.koordinat;
            koordinatLoaded = true;
            currentKoordinat = getRandomCoordinate();
            coordValueSpan.textContent = currentKoordinat;
        } catch (error) {
            console.error('Gagal memuat koordinat:', error);
            koordinatLoaded = false;
            coordValueSpan.textContent = 'Gagal memuat koordinat';
        }
        checkInputCompletion();
    }
    
    function getRandomCoordinate() {
        if (!koordinatLoaded || KOORDINAT_LIST.length === 0) {
            return "-8° 8'38.215S, 115°6'52.463E";
        }
        return KOORDINAT_LIST[Math.floor(Math.random() * KOORDINAT_LIST.length)];
    }
    
    function refreshCoordinate() {
        if (koordinatLoaded && KOORDINAT_LIST.length > 0) {
            currentKoordinat = getRandomCoordinate();
            coordValueSpan.textContent = currentKoordinat;
            updateCanvasPreview();
            checkInputCompletion();
        }
    }
    
    function updateJudul() {
        let raw = judulInput.value.trim();
        if (raw === "") raw = "Kelurahan Liligundi";
        currentJudul = raw;
        document.title = `${currentJudul} - DUKOPS`;
        updateCanvasPreview();
    }
    
    // ======================== PREVIEW GAMBAR ========================
    function previewImage(file) {
        if (!file) return;
        
        fileNameDisplay.textContent = file.name;
        fileInputLabel.style.background = "#254f3f";
        
        if (koordinatLoaded && KOORDINAT_LIST.length > 0) {
            currentKoordinat = getRandomCoordinate();
            coordValueSpan.textContent = currentKoordinat;
        }
        
        const currentDateValue = tanggalInput.value;
        if (currentDateValue) {
            acakDetik(currentDateValue);
        }
        
        const reader = new FileReader();
        reader.onload = function(e) {
            currentImage = new Image();
            currentImage.onload = function() {
                updateCanvasPreview();
                checkInputCompletion();
            };
            currentImage.onerror = function() {
                fileNameDisplay.textContent = 'Gagal memuat gambar';
                checkInputCompletion();
            };
            currentImage.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }
    
    function updateDatePreview(dateString) {
        if (!dateString) return;
        acakDetik(dateString);
        updateCanvasPreview();
    }
    
    function updateCanvasPreview() {
        canvas.width = 759;
        canvas.height = 300;
        
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (currentImage.complete && currentImage.src && currentImage.naturalWidth > 0) {
            ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = '#2a5e48';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#bde5ca';
            ctx.font = "25px Arial";
            ctx.textAlign = "center";
            ctx.fillText("Pilih foto untuk preview", canvas.width/2, canvas.height/2);
        }
        
        ctx.fillStyle = "white";
        ctx.font = "25px Arial";
        ctx.textAlign = "right";
        
        ctx.fillText(currentJudul.substring(0, 40), canvas.width - 10, canvas.height - 80);
        ctx.fillText(currentKoordinat || "Koordinat Tidak Tersedia", canvas.width - 10, canvas.height - 50);
        
        let dateObj = new Date(currentTimestamp);
        if (!isNaN(dateObj.getTime())) {
            const dateStr = dateObj.toLocaleDateString("id-ID", { day: "2-digit", month: "long", year: "numeric" });
            const timeStr = dateObj.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
            ctx.fillText(`${dateStr}, ${timeStr}`, canvas.width - 10, canvas.height - 20);
        } else {
            ctx.fillText("Tanggal belum dipilih", canvas.width - 10, canvas.height - 20);
        }
    }
    
    function checkInputCompletion() {
        const hasImage = gambarInput.files.length > 0 && currentImage.complete && currentImage.src;
        const hasDate = tanggalInput.value.trim() !== "";
        const hasNarasi = narasiText.value.trim() !== "";
        const hasJudul = judulInput.value.trim() !== "";
        const hasKoordinat = koordinatLoaded && KOORDINAT_LIST.length > 0;
        
        downloadBtn.disabled = !(hasImage && hasDate && hasNarasi && hasJudul && hasKoordinat);
    }
    
    // ======================== SIMPAN LAPORAN ========================
    async function saveReport() {
        if (downloadBtn.disabled) {
            if (!koordinatLoaded) alert("Koordinat belum dimuat. Periksa koneksi internet!");
            else alert("Lengkapi semua data terlebih dahulu!");
            return;
        }
        
        const currentDateValue = tanggalInput.value;
        if (!currentDateValue) {
            alert("Pilih tanggal dan waktu terlebih dahulu!");
            return;
        }
        
        // CEK ANTI GANDA - Apakah tanggal LENGKAP (YYYY-MM-DD) ini sudah pernah dibuat laporan?
        if (isFullDateAlreadySubmitted(currentDateValue)) {
            const dateObj = new Date(currentDateValue);
            const tanggalFormatted = dateObj.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
            alert(`⚠️ GAGAL! Laporan untuk tanggal ${tanggalFormatted} sudah pernah dibuat.\n\nSilakan pilih TANGGAL YANG BERBEDA.`);
            return;
        }
        
        const dateObj = new Date(currentDateValue);
        if (isNaN(dateObj.getTime())) { 
            alert("Tanggal tidak valid"); 
            return; 
        }
        
        // Acak detik sebelum simpan
        acakDetik(currentDateValue);
        
        const formattedDate = dateObj.toLocaleDateString('id-ID', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
        const formattedTime = dateObj.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        
        if (!confirm(`Simpan laporan?\n\n📌 Judul: ${currentJudul}\n📅 Tanggal: ${formattedDate}\n🕐 Waktu: ${formattedTime}\n📍 Koordinat: ${currentKoordinat}\n\n⚠️ Perhatian: Tanggal yang sama tidak bisa digunakan dua kali!`)) return;
        
        loader.style.display = "block";
        downloadBtn.disabled = true;
        downloadBtn.textContent = "⏳ MEMPROSES...";
        
        try {
            sequenceNumber++;
            const ddmm = dateObj.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit' }).replace(/\//g, "-");
            let safeJudul = currentJudul.replace(/[^a-zA-Z0-9]/g, "_").substring(0, 30);
            if (!safeJudul) safeJudul = "Kegiatan";
            const finalName = `${sequenceNumber}_${safeJudul}_${ddmm}`.replace(/\s/g, "_");
            
            updateCanvasPreview();
            
            const imageDataURL = canvas.toDataURL("image/png");
            const narasiContent = narasiText.value;
            
            const txtContent = `Judul Kegiatan: ${currentJudul}
Tanggal: ${formattedDate}
Waktu input kegiatan: ${formattedTime}
NARASI:
${narasiContent}

Koordinat: ${currentKoordinat}
Koramil 1609-01/Buleleng - Kelurahan Liligundi`;
            
            if (typeof JSZip === 'undefined') throw new Error("JSZip tidak dimuat!");
            
            const zip = new JSZip();
            zip.file(`${finalName}_Laporan.txt`, txtContent);
            zip.file(`${finalName}_Dokumentasi.png`, imageDataURL.split("base64,")[1], { base64: true });
            const zipBlob = await zip.generateAsync({ type: "blob" });
            
            const link = document.createElement('a');
            const url = URL.createObjectURL(zipBlob);
            link.href = url;
            link.download = `${finalName}.zip`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            // Simpan tanggal LENGKAP yang sudah digunakan (YYYY-MM-DD)
            saveSubmittedFullDate(currentDateValue);
            addLog(`${finalName}.zip`);
            alert(`✅ Laporan berhasil disimpan!\n📦 ${finalName}.zip\n\n📌 Catatan: Tanggal ${formattedDate} tidak bisa digunakan lagi.`);
            
        } catch (err) {
            console.error(err);
            alert("Gagal menyimpan: " + err.message);
        } finally {
            loader.style.display = "none";
            downloadBtn.disabled = false;
            downloadBtn.textContent = "💾 SIMPAN LAPORAN (ZIP)";
            checkInputCompletion();
        }
    }
    
    // ======================== PWA INSTALL ========================
    let deferredPrompt;
    const installDiv = document.getElementById('installContainer');
    const installBtn = document.getElementById('installButton');
    const closeInstall = document.getElementById('closeInstall');
    
    if (installBtn) {
        installBtn.addEventListener('click', async () => {
            installDiv.style.display = 'none';
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response: ${outcome}`);
                deferredPrompt = null;
            } else {
                alert("Installasi bisa dilakukan melalui menu browser: 'Install App' atau 'Tambahkan ke Home Screen'");
            }
        });
    }
    if (closeInstall) {
        closeInstall.addEventListener('click', () => {
            installDiv.style.display = 'none';
        });
    }
    
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installDiv.style.display = 'block';
    });
    
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registered:', reg.scope))
                .catch(err => console.log('Service Worker failed:', err));
        });
    }
    
    // ======================== EVENT LISTENERS ========================
    judulInput.addEventListener('input', () => { updateJudul(); checkInputCompletion(); });
    tanggalInput.addEventListener('input', (e) => { updateDatePreview(e.target.value); checkInputCompletion(); });
    narasiText.addEventListener('input', checkInputCompletion);
    downloadBtn.addEventListener('click', saveReport);
    resetBtn.addEventListener('click', resetAllData);
    refreshCoordBtn.addEventListener('click', refreshCoordinate);
    
    // Event untuk input file
    gambarInput.addEventListener('change', function(e) {
        if (e.target.files && e.target.files[0]) {
            previewImage(e.target.files[0]);
        } else {
            fileNameDisplay.textContent = 'Belum ada file';
            fileInputLabel.style.background = '#1e352b';
            checkInputCompletion();
        }
    });
    
    // ======================== INIT ========================
    async function init() {
        loadLogs();
        
        const now = new Date();
        const tahun = now.getFullYear();
        const bulan = String(now.getMonth() + 1).padStart(2, '0');
        const tanggal = String(now.getDate()).padStart(2, '0');
        const jam = String(now.getHours()).padStart(2, '0');
        const menit = String(now.getMinutes()).padStart(2, '0');
        const defaultDateTime = `${tahun}-${bulan}-${tanggal}T${jam}:${menit}`;
        tanggalInput.value = defaultDateTime;
        
        acakDetik(defaultDateTime);
        updateJudul();
        await loadKoordinat();
        updateCanvasPreview();
        checkInputCompletion();
    }
    
    init();
</script>
</body>
</html>
